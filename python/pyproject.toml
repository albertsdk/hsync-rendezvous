[project]
name = "hsync-rendezvous"
version = "1.2.0-beta.1"
description = "HSYNC P2P rendezvous node (no-log, in-memory, zero-knowledge)"
authors = [{name = "Alberto Basso", email = "17047798+albertsdk@users.noreply.github.com"}]
license = "BSD-3-Clause"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "aioquic>=1.2.0,<2.0.0",
    "hsync-common==1.2.0-beta.1",
    "pydantic>=2.12.0,<3.0.0",
    "typer>=0.29.0,<0.30.0",
    "uvloop>=0.23.0,<0.24.0; sys_platform != 'win32'",
]

[project.scripts]
hsync-rendezvous = "hsync_rendezvous.main:main"

[tool.poetry]
packages = [{ include = "hsync_rendezvous", from = "src" }]

[tool.poetry.dependencies]
hsync-common = {path = "../../hsync-common", develop = true}

[tool.poetry.group.build.dependencies]
pyinstaller = "^6.22"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-asyncio = "^1.3.0"
ruff = "0.17.6"
mypy = "^2.1.0"
coverage = "^7.16"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["../../hsync-common"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# Curated best-practice set shared across the hsync Python projects (see
# hsync-common/pyproject.toml for the rationale).
select = [
    "E", "F", "W",
    "I",
    "N",
    "UP",
    "B", "A", "C4",
    "ISC", "ICN",
    "PIE", "RET", "RSE",
    "SIM", "TID",
    "ARG", "PERF",
    "FURB", "RUF",
    "PGH", "LOG", "G",
    "PL", "T10", "ERA",
    "C90",
]
ignore = [
    # pre-existing
    "E501", "E402", "B904", "B008", "B017",
    "SIM115", "SIM117", "SIM102", "SIM105", "SIM101", "SIM103", "SIM118",
    # deliberate patterns / opinionated rules
    "ARG002", "EM101", "EM102", "TRY003", "N818",
    "PLC0415", "PLW0603", "PLR2004",
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917",
    "PTH", "DTZ005", "ERA001", "RUF002", "RUF003",
    # rendezvous-specific: callbacks keep otherwise-unused arguments, same-name
    # aliases mark deliberate re-exports, and lists use multi-line concatenation.
    "ARG001", "ARG005", "ISC004", "PLC0414",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "ARG004", "RUF059", "RUF012", "RUF007", "RUF015", "RUF005", "RUF010",
    "RUF046", "PLR0402", "PLW0108", "PLW1510", "PLW2901", "RET501", "RET504",
    "PLR1711", "PIE807", "PIE808", "PIE810", "FURB171", "ICN001", "RSE102",
    "PERF401",
]
"fuzz/**" = ["PERF401"]
# The upnp ``__all__`` groups the service classes before the functions.
"src/hsync_rendezvous/upnp.py" = ["RUF022"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.mypy]
python_version = "3.13"
warn_return_any = false
warn_unused_ignores = false
disallow_untyped_defs = false
ignore_missing_imports = true
no_implicit_optional = false

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"